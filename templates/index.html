<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Chatbot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <button onclick="createNewChat()">+ New Chat</button>
      <ul id="chat-list">
        {% for chat in chats %}
          <li onclick="loadChat({{ chat.id }})" data-id="{{ chat.id }}">{{ chat.title }}</li>
        {% endfor %}
      </ul>
      <button onclick="logout()">Logout</button>
    </div>

    <div class="chat-container">
      <h2>AI Chatbot 🤖</h2>
      <div id="chat-box"></div>
      <div class="input-area">
        <input type="text" id="user-input" placeholder="Type your message..." onkeypress="if(event.key==='Enter'){sendMessage()}">
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

  <script>
    let currentChatId = null;

    async function createNewChat() {
      const res = await fetch("/new_chat", { method: "POST" });
      if (!res.ok) return alert("Error creating chat");
      const data = await res.json();
      currentChatId = data.chat_id;
      document.getElementById("chat-list").innerHTML += `<li onclick="loadChat(${data.chat_id})">${data.title}</li>`;
      loadChat(currentChatId);
    }

    async function loadChat(chatId) {
      currentChatId = chatId;
      const res = await fetch(`/get_history/${chatId}`);
      if (!res.ok) {
        console.error("Failed to load chat history", await res.text());
        return;
      }
      const history = await res.json();
      renderChat(history);
    }

    async function sendMessage() {
      if (!currentChatId) {
        alert("Create or select a chat first!");
        return;
      }
      const input = document.getElementById("user-input");
      const message = input.value.trim();
      if (!message) return;

      input.value = "";
      addMessage("user", message);

      const res = await fetch(`/get/${currentChatId}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message })
      });

      if (!res.ok) {
        console.error("Failed to send message", await res.text());
        return;
      }

      const data = await res.json();
      addMessage("bot", data.response);
    }

    function renderChat(history) {
      const chatBox = document.getElementById("chat-box");
      chatBox.innerHTML = "";
      history.forEach(msg => addMessage(msg.sender, msg.text));
    }

    function addMessage(sender, text) {
      const chatBox = document.getElementById("chat-box");
      const div = document.createElement("div");
      div.className = sender;
      div.textContent = (sender === "user" ? "You: " : "Bot: ") + text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function logout() {
      window.location.href = "/logout";
    }
  </script>
</body>
</html>
